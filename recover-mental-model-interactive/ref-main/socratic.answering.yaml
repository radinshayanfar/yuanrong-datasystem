      \ Expert)"
  - id: Q2.6.4
    text: What is the recommended default WriteMode and ConsistencyType (PRAM vs.
      Causal) per scenario, and why is PRAM the base case (=0)? (Architect, Domain
      Expert)
  - id: Q5.5.1
    text: "What are the validated scale limits \u2014 max nodes, max objects/keys\
      \ per master, max metadata memory \u2014 so we know whether scaling risks are\
      \ real or theoretical? (Architect, Operations)"
